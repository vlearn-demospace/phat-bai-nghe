<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phát bài nghe</title>
<link rel="icon" href="/vlearn-logo.png">
<meta name="theme-color" content="#0b3162">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vlearn.css">
<style>
body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.card{width:min(480px,100%);padding:26px}
.brand{margin-bottom:18px}
h1{margin:0 0 4px;font-size:22px;font-weight:700;color:rgb(var(--navy-text))}
.err{color:rgb(var(--chip-errorText));min-height:20px;margin-top:10px;font-size:13px}
#slug{text-transform:lowercase}
</style></head><body>
<div class="card">
  <div class="brand"><img src="/vlearn-logo.png" alt="VLearn"><div class="eyebrow">VLearn Education</div></div>
  <h1>Phát bài nghe có khoá theo giờ</h1>
  <p class="mute">Nhập mã trường (ví dụ <b>lvc</b>), hoặc mở đúng địa chỉ in trên phiếu mã phòng.</p>
  <label for="slug">Mã trường</label><input type="text" id="slug" maxlength="30" autocomplete="off" spellcheck="false" placeholder="mã trường">
  <button id="go" class="b-primary">Tiếp tục</button>
  <div class="err" id="msg"></div>
  <p class="mute" style="font-size:13px;margin-top:14px"><a href="/huong-dan">Hướng dẫn sử dụng</a></p>
</div>
<script>
const go = () => {
  const s = document.getElementById('slug').value.trim().toLowerCase();
  if (!/^[a-z0-9-]{2,30}$/.test(s)) { document.getElementById('msg').textContent = 'Mã trường chỉ gồm chữ thường không dấu, số và dấu -'; return; }
  location.href = '/' + s + '/';
};
document.getElementById('go').onclick = go;
document.getElementById('slug').onkeydown = e => { if (e.key === 'Enter') go(); };
if (location.pathname.length > 1) document.getElementById('msg').textContent = 'Không tìm thấy trường “' + decodeURIComponent(location.pathname.split('/')[1]) + '”.';
</script>
</body></html>
